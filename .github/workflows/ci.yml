name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cpp:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          cd $VCPKG_ROOT
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Install dependencies (vcpkg manifest)
        working-directory: gameserver
        run: $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Build (CMake)
        working-directory: gameserver
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Run tests
        working-directory: gameserver/build
        run: ctest --output-on-failure

  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/MOBA.sln

      - name: Build
        run: dotnet build backend/MOBA.sln --no-restore -c Release

      - name: Test
        run: dotnet test backend/MOBA.sln --no-build --verbosity normal

  gen-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler

      - name: Run schema generation
        run: bash tools/gen_schemas.sh

      - name: Verify generated files are clean
        run: |
          git diff --exit-code || (echo "Generated files are out of date. Run gen_schemas.sh and commit the changes." && exit 1)